<!doctype html>
<!--
  TALYNT LABS — "Buddy: the feature tour", a 93-second ad with voiceover.
  One composition, two shapes: ad.html?f=v (1080×1920) and ad.html?f=s (1080×1080).

  The 22 live features of Buddy, the AI hiring agent by TALYNT LABS, in six
  chapters (Define, Find, Screen, Engage, Interview, Decide). Each feature is a
  short scene: its name slams in on a lime swipe and lifts to the top; its tiles
  spring in, stay still while they're read, and fly out before the next cut.
  The on-screen text of each feature is exactly as supplied by TALYNT. The
  bright look and motion rules follow ads/buddy.

  Every movement is a CSS animation on one timeline, so render.mjs can pause
  the page and step it frame by frame. Times follow vo.json; cuts land on the
  beat of music.py (120 BPM funk).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TALYNT LABS — Buddy feature tour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800;900&family=Geist+Mono:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..500;1,8..60,300..500&display=block"
      rel="stylesheet"
    />
    <style>
      @property --n { syntax: "<integer>"; initial-value: 0; inherits: true; }
      @property --ring { syntax: "<number>"; initial-value: 0; inherits: false; }

      :root {
        --bg: #f4f3ee;
        --card: #ffffff;
        --soft: #f1f0ea;
        --line: #e3e2da;
        --ink: #0d0d0d;
        --ink2: #3b3b38;
        --mute: #6b6b66;
        --lime: #c8f04a;
        --lime-ink: #3f5a00;
        --red: #d93b30;
        --red-soft: #fde8e6;
        --amber: #b86e00;
        --amber-soft: #fff1d6;
        --glow: 200 240 74;
        --serif: "Source Serif 4", Georgia, serif;
        --sans: "Geist", system-ui, sans-serif;
        --mono: "Geist Mono", ui-monospace, monospace;
        --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --END: 89s;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

      .frame { position: relative; width: 1080px; height: 1920px; overflow: hidden; isolation: isolate; background: var(--bg); --mid: 960px; --head: 470px; --vis-top: 740px; --s: 1.16; }
      .frame[data-f="s"] { height: 1080px; --mid: 540px; --head: 140px; --vis-top: 230px; --s: 0.84; }
      .cam { position: absolute; inset: 0; }
      @keyframes shake { 0% { transform: none; } 25% { transform: translate(-7px, 4px); } 50% { transform: translate(5px, -4px); } 75% { transform: translate(-2px, 2px); } 100% { transform: none; } }

      .bg { position: absolute; inset: 0; z-index: -2;
        background:
          radial-gradient(ellipse 60% 35% at 85% 10%, rgb(var(--glow) / 0.45), transparent 70%),
          radial-gradient(ellipse 55% 30% at 10% 95%, rgb(var(--glow) / 0.35), transparent 70%),
          radial-gradient(rgb(0 0 0 / 0.07) 1.6px, transparent 2px) 0 0 / 28px 28px,
          var(--bg); }

      .brand { position: absolute; top: 64px; left: 72px; z-index: 6; animation: fade-in 0.4s ease 0.1s both, fade-out 0.2s ease 88.9s forwards; }
      .frame[data-f="s"] .brand { top: 40px; left: 50px; }
      .brand img { height: 50px; }
      .frame[data-f="s"] .brand img { height: 38px; }

      /* Chapters along the bottom: six labelled segments that fill as the tour moves. */
      .chapters { position: absolute; left: 72px; right: 72px; bottom: 96px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; z-index: 6; animation: fade-in 0.4s ease 6s both, fade-out 0.2s ease 85.4s forwards; }
      .frame[data-f="s"] .chapters { bottom: 54px; left: 50px; right: 50px; }
      .chapters div { display: grid; gap: 10px; }
      .chapters i { height: 8px; border-radius: 99px; background: var(--line); position: relative; overflow: hidden; }
      .chapters i::after { content: ""; position: absolute; inset: 0; background: var(--ink); transform: scaleX(0); transform-origin: left; animation: fill var(--len) linear var(--at) forwards; }
      .chapters b { font-family: var(--mono); font-weight: 500; font-size: 18px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); animation: chap-on 0.01s linear var(--at) forwards, chap-off 0.01s linear calc(var(--at) + var(--len)) forwards; }
      .frame[data-f="s"] .chapters b { font-size: 13px; }
      @keyframes chap-on { to { color: var(--ink); } }
      @keyframes chap-off { to { color: var(--mute); } }
      @keyframes fill { to { transform: scaleX(1); } }
      .note { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; font-family: var(--mono); font-size: 17px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--mute); z-index: 6; animation: fade-in 0.4s ease 2s both; }
      .frame[data-f="s"] .note { bottom: 18px; font-size: 13px; }

      .wipe { position: absolute; top: -10%; bottom: -10%; left: 0; width: 70%; z-index: 20; background: var(--lime); transform: translateX(-160%) skewX(-16deg); animation: wipe 0.34s cubic-bezier(0.7, 0, 0.3, 1) var(--at) both; }
      .wipe.dark { background: var(--ink); }
      @keyframes wipe { from { transform: translateX(-160%) skewX(-16deg); } to { transform: translateX(260%) skewX(-16deg); } }
      @keyframes fade-in { from { opacity: 0; } }
      @keyframes fade-out { to { opacity: 0; } }

      /* --- Scenes --------------------------------------------------------------------- */
      .scene { position: absolute; inset: 0; animation: gone 0.01s linear var(--out) forwards; }
      @keyframes gone { to { visibility: hidden; } }

      .step { position: absolute; left: 50%; top: var(--mid); z-index: 4; white-space: nowrap; animation: slam 0.75s linear var(--in) both, step-out 0.3s cubic-bezier(0.6, 0, 0.8, 0.4) calc(var(--out) - 0.36s) forwards; }
      .step span { position: relative; display: inline-block; padding: 0 24px; font-weight: 900; font-size: var(--fs, 124px); line-height: 1.08; letter-spacing: -0.04em; text-transform: uppercase; }
      .step span::before { content: ""; position: absolute; left: 0; right: 0; top: 18%; bottom: 10%; z-index: -1; background: var(--lime); border-radius: 12px; transform: scaleX(0) skewX(-8deg); transform-origin: left; animation: swipe 0.3s var(--ease) calc(var(--in) + 0.22s) forwards; }
      @keyframes swipe { to { transform: scaleX(1) skewX(-8deg); } }
      .step span em { display: inline-block; font-style: normal; animation: hop 0.45s var(--spring) calc(var(--in) + var(--k) * 0.025s) both; }
      @keyframes hop { from { opacity: 0; transform: translateY(-80%) rotate(-20deg) scale(0.6); } }
      @keyframes slam {
        0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2) rotate(-5deg); animation-timing-function: cubic-bezier(0.5, 0, 0.9, 0.5); }
        16% { opacity: 1; transform: translate(-50%, -50%) scale(0.94) rotate(1deg); }
        26% { transform: translate(-50%, -50%) scale(1.03); }
        34%, 48% { transform: translate(-50%, -50%) scale(1); animation-timing-function: cubic-bezier(0.7, 0, 0.2, 1); }
        100% { opacity: 1; transform: translate(-50%, calc(-50% - var(--mid) + var(--head))) scale(0.44); }
      }
      @keyframes step-out { from { opacity: 1; transform: translate(-50%, calc(-50% - var(--mid) + var(--head))) scale(0.44); } to { opacity: 0; transform: translate(-50%, calc(-50% - var(--mid) + var(--head) - 140px)) scale(0.44); } }

      .vis { position: absolute; top: var(--vis-top); left: 50%; width: 900px; height: 900px; margin-left: -450px; transform-origin: 50% 0; scale: var(--s); }

      /* Tiles: spring in (--d), stay still, fly out (--x) before the cut. */
      .tile { position: absolute; left: 0; right: 0; background: var(--card); border: 1px solid var(--line); border-radius: 30px; box-shadow: 0 30px 70px -36px rgb(0 0 0 / 0.35), 0 2px 0 rgb(0 0 0 / 0.04); padding: 30px 34px;
        animation: tile-in 0.55s var(--spring) calc(var(--in) + 0.62s + var(--d, 0s)) both, tile-out 0.32s cubic-bezier(0.6, 0, 0.9, 0.5) calc(var(--out) - 0.38s + var(--x, 0s)) forwards; }
      @keyframes tile-in { from { opacity: 0; transform: translateY(130px) scale(0.86) rotate(var(--r, 3deg)); } }
      @keyframes tile-out { to { opacity: 0; transform: translateY(-110px) scale(0.92) rotate(calc(var(--r, 3deg) * -1)); } }
      .pop { animation: pop 0.4s var(--spring) calc(var(--in) + 0.8s + var(--d, 0s)) both; }
      @keyframes pop { from { opacity: 0; transform: scale(0.6) translateY(16px); } }
      .ty { animation: type var(--t, 0.8s) steps(36, end) calc(var(--in) + 0.8s + var(--d, 0s)) both; }
      @keyframes type { from { clip-path: inset(0 100% 0 0); } to { clip-path: inset(0 0 0 0); } }
      .stamp { animation: stamp 0.45s cubic-bezier(0.2, 1.4, 0.4, 1) calc(var(--in) + 0.8s + var(--d, 0s)) both; }
      @keyframes stamp { 0% { opacity: 0; transform: scale(2.4) rotate(-12deg); } 60% { opacity: 1; transform: scale(0.95) rotate(2deg); } 100% { opacity: 1; transform: rotate(-2deg); } }

      .chip { display: inline-flex; align-items: center; gap: 10px; padding: 12px 22px; border-radius: 99px; border: 1px solid var(--line); background: var(--soft); font-size: 27px; white-space: nowrap; }
      .chip.on { background: rgb(var(--glow) / 0.35); border-color: rgb(var(--glow) / 0.95); }
      .chip.ink { background: var(--ink); color: #fff; border-color: var(--ink); font-weight: 700; }
      .chip.red { background: var(--red-soft); border-color: #f3b4ae; color: var(--red); font-weight: 600; }
      .chip.amber { background: var(--amber-soft); border-color: #f2cf8c; color: var(--amber); font-weight: 600; }
      .chips { display: flex; flex-wrap: wrap; gap: 12px; }
      .tag { font-family: var(--mono); font-size: 19px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mute); }
      .tag.lime { color: var(--lime-ink); }
      .big { font-weight: 800; font-size: 44px; letter-spacing: -0.02em; line-height: 1.15; }
      .mid { font-weight: 600; font-size: 32px; line-height: 1.3; }
      .serif { font-family: var(--serif); font-weight: 400; }
      .row { display: flex; align-items: center; gap: 18px; }
      .col { display: grid; gap: 16px; }
      .avatar { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--ink); color: var(--lime); font-family: var(--mono); font-weight: 600; font-size: 25px; flex: none; }
      .mark { position: relative; display: grid; place-items: center; width: var(--o, 60px); height: var(--o, 60px); flex: none; border-radius: 50%; background: var(--ink); }
      .mark::after { content: ""; width: 44%; height: 44%; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 calc(var(--o, 60px) * 0.06) var(--ink), 0 0 0 calc(var(--o, 60px) * 0.1) var(--lime); }
      .key { display: inline-flex; align-items: center; gap: 12px; padding: 16px 24px; border-radius: 18px; border: 2px solid var(--ink); background: #fff; font-weight: 700; font-size: 28px; box-shadow: 0 5px 0 var(--ink); }
      .key kbd { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 9px; background: var(--ink); color: #fff; font-family: var(--mono); font-size: 22px; }
      .key.lime { background: var(--lime); }
      .pill { display: inline-flex; align-items: center; gap: 12px; padding: 16px 30px; border-radius: 99px; background: var(--lime); color: var(--ink); font-weight: 800; font-size: 32px; white-space: nowrap; border: 3px solid var(--ink); box-shadow: 6px 6px 0 var(--ink); }
      .quote { font-family: var(--serif); font-size: 38px; line-height: 1.3; padding-left: 26px; border-left: 6px solid var(--lime); }
      .bar { height: 18px; border-radius: 99px; background: var(--soft); border: 1px solid var(--line); overflow: hidden; }
      .bar i { display: block; height: 100%; width: var(--w); border-radius: 99px; background: var(--ink); animation: grow 0.8s var(--ease) calc(var(--in) + 0.9s + var(--d, 0s)) both; }
      @keyframes grow { from { width: 0; } }
      .ring { --ring: var(--to); --n: var(--to); display: grid; place-items: center; width: 150px; height: 150px; flex: none; border-radius: 50%; background: conic-gradient(var(--ink) calc(var(--ring) * 1%), var(--line) 0); animation: ringfill 0.9s var(--ease) calc(var(--in) + 0.9s + var(--d, 0s)) both; }
      @keyframes ringfill { from { --ring: 0; --n: 0; } }
      .ring > span { display: grid; place-items: center; width: 122px; height: 122px; border-radius: 50%; background: var(--lime); font-weight: 900; font-size: 52px; counter-reset: n var(--n); }
      .ring > span::before { content: counter(n); }
      .dots { display: flex; gap: 10px; }
      .dots i { width: 30px; height: 30px; border-radius: 50%; background: var(--ink); }
      .dots i.off { background: var(--line); }
      svg.i { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

      /* Phone, for the candidate's side. */
      .phone { position: absolute; left: 50%; top: 0; width: 470px; height: 760px; margin-left: -235px; padding: 16px; border-radius: 64px; background: var(--ink); box-shadow: 0 50px 90px -40px rgb(0 0 0 / 0.6); animation: tile-in 0.55s var(--spring) calc(var(--in) + 0.62s) both, tile-out 0.32s cubic-bezier(0.6, 0, 0.9, 0.5) calc(var(--out) - 0.38s) forwards; --r: -3deg; }
      .screen { height: 100%; border-radius: 50px; background: #fff; padding: 70px 30px 30px; display: grid; align-content: start; gap: 20px; }
      .screen .from { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 26px; }
      .bubble { padding: 18px 22px; border-radius: 22px; border-bottom-left-radius: 6px; background: var(--soft); border: 1px solid var(--line); font-size: 28px; line-height: 1.35; }
      .btn { display: grid; place-items: center; padding: 20px; border-radius: 18px; background: var(--lime); border: 2px solid var(--ink); font-weight: 800; font-size: 28px; }
      .toast { display: flex; align-items: center; gap: 12px; padding: 18px 22px; border-radius: 18px; background: var(--ink); color: #fff; font-weight: 700; font-size: 28px; }
      .toast svg { color: var(--lime); width: 34px; height: 34px; }
      .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .slots span { padding: 16px 10px; border-radius: 14px; border: 1px solid var(--line); background: var(--soft); text-align: center; font-weight: 600; font-size: 24px; }
      .slots span.on { background: var(--lime); border: 2px solid var(--ink); }

      /* --- Hook and closing: big words ---------------------------------------------------- */
      .words { position: absolute; left: 72px; right: 72px; top: calc(var(--mid) - 330px); display: grid; gap: 8px; }
      .frame[data-f="s"] .words { left: 60px; right: 60px; top: 220px; }
      .words b { display: block; white-space: nowrap; font-weight: 900; font-size: var(--wfs, 172px); line-height: 0.98; letter-spacing: -0.05em; text-transform: uppercase; animation: word 0.5s var(--spring) var(--d) both, word-out 0.3s cubic-bezier(0.6, 0, 0.9, 0.5) calc(var(--out) - 0.38s + var(--x)) forwards; }
      .frame[data-f="s"] .words b { font-size: calc(var(--wfs, 172px) * 0.72); }
      .words b.hi { justify-self: start; padding: 0 22px; background: var(--lime); border: 5px solid var(--ink); border-radius: 20px; box-shadow: 10px 10px 0 var(--ink); rotate: -3deg; }
      @keyframes word { from { opacity: 0; transform: translateY(90px) rotate(6deg) scale(0.7); } }
      @keyframes word-out { to { opacity: 0; transform: translateX(-160px) rotate(-8deg); } }

      /* --- End card -------------------------------------------------------------------------- */
      .end { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; text-align: center; gap: 46px; }
      .end .logo { height: 170px; animation: end-in 0.7s var(--spring) calc(var(--END) + 0.1s) both; }
      .end .who { display: flex; align-items: center; gap: 18px; font-size: 34px; font-weight: 600; color: var(--ink2); animation: end-in 0.6s var(--spring) calc(var(--END) + 0.45s) both; }
      .end .who .mark { --o: 56px; }
      .end .cta { animation: end-in 0.6s var(--spring) calc(var(--END) + 0.75s) both; font-size: 44px; padding: 26px 56px; }
      .end .url { font-family: var(--mono); font-size: 34px; letter-spacing: 0.06em; animation: end-in 0.6s var(--spring) calc(var(--END) + 1s) both; }
      @keyframes end-in { from { opacity: 0; transform: translateY(80px) scale(0.8); } }
      .frame[data-f="s"] .end { gap: 26px; }
      .frame[data-f="s"] .end .logo { height: 120px; }
      .frame[data-f="s"] .end .cta { font-size: 32px; padding: 20px 44px; }
      .frame[data-f="s"] .end .url { font-size: 26px; }
      .confetti { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; border-radius: 3px; background: var(--lime); opacity: 0; animation: burst 1.4s cubic-bezier(0.1, 0.8, 0.3, 1) calc(var(--END) + 0.15s) both; }
      .confetti.k { background: var(--ink); }
      @keyframes burst { 0% { opacity: 0; transform: none; } 4%, 80% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); } }
    </style>
  </head>
  <body>
    <div class="frame" id="frame">
      <div class="cam" id="cam">
        <div class="bg"></div>
        <div id="scenes"></div>
        <section class="end" id="end">
          <img class="logo" src="../../public/brand/talynt-primary-mono.svg" alt="TALYNT LABS" />
          <p class="who"><span class="mark"></span>Buddy · AI hiring agent</p>
          <p class="pill cta">Book a demo →</p>
          <p class="url">talyntlabs.com</p>
        </section>
      </div>
      <div id="cuts"></div>
      <div class="brand"><img src="../../public/brand/talynt-primary-mono.svg" alt="TALYNT LABS" /></div>
      <div class="chapters" id="chapters"></div>
      <p class="note">Illustrative product visuals · fictional people</p>
    </div>

    <script>
      const f = new URLSearchParams(location.search).get("f") === "s" ? "s" : "v";
      document.getElementById("frame").dataset.f = f;
      const el = (tag, cls, html, style) => {
        const e = document.createElement(tag);
        if (cls) e.className = cls;
        if (html !== undefined) e.innerHTML = html;
        if (style) e.setAttribute("style", style);
        return e;
      };
      const CHECK = '<svg class="i" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></svg>';
      const EXT = '<svg class="i" viewBox="0 0 24 24"><path d="M14 5h5v5M19 5l-8 8M18 14v5H5V6h5" /></svg>';
      const BELL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5l1.5 1.5H5Z" /><path d="M10 20.5h4" /></svg>';
      const PEN = '<svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16Z" /></svg>';

      // Tile helper: top offset (px in the 900 board), entrance delay, exit stagger, tilt.
      const T = (html, top, d = 0, x = 0, r = 3, extra = "") => `<div class="tile ${extra}" style="top:${top}px;--d:${d}s;--x:${x}s;--r:${r}deg">${html}</div>`;

      // Cut times (seconds) follow vo.json: each scene runs from its cut to the next.
      const CUTS = [2, 6, 11.5, 14.5, 20, 23.5, 26.5, 29.5, 32, 35, 39, 43, 45.5, 50, 52.5, 55, 59.5, 63.5, 68, 71.5, 75, 78.5, 82.5, 85.5, 89];

      const SCENES = [
        // Meet Buddy
        { name: "Meet Buddy", body: T(`<div class="col" style="justify-items:center;text-align:center;gap:14px"><span class="mark" style="--o:180px"></span><p style="font-weight:900;font-size:130px;letter-spacing:-0.05em;line-height:1">Buddy</p><p class="tag">AI hiring agent · TALYNT LABS</p></div>`, 0, 0, 0, -3) },
        // ——— Define
        { name: "Role insights", body:
          T(`<p class="tag lime">Role insights</p><p class="serif" style="font-size:52px;margin:10px 0 18px">Senior Backend Engineer</p><div class="chips">
            <span class="chip on pop" style="--d:0.25s">Payments infrastructure</span><span class="chip on pop" style="--d:0.4s">Event-driven systems</span><span class="chip on pop" style="--d:0.55s">On-call ownership</span></div>`, 0, 0, 0, -2) },
        { name: "Must-haves", body:
          T(`<div class="row" style="justify-content:space-between"><span class="mid">Payments infrastructure</span><span class="chip ink pop" style="--d:0.3s">Must-have ✓</span></div>`, 0, 0, 0.06, -2) +
          T(`<div class="row"><span class="avatar">AK</span><span class="mid" style="flex:1">Aarav K.</span><span class="chip on pop" style="--d:0.6s">${CHECK} Meets all must-haves</span></div>`, 170, 0.3, 0, 2) },
        { name: "Calibration", body:
          T(`<div class="row"><span class="avatar">RS</span><span class="mid">Platform engineer · 9 yrs</span></div><div class="row" style="margin-top:22px;gap:12px">
            <span class="key lime pop" style="--d:0.3s">Would meet ✓</span><span class="key pop" style="--d:0.4s">Wouldn’t meet ✕</span><span class="key pop" style="--d:0.5s">Not sure</span></div>`, 0, 0, 0.06, -2) +
          T(`<p class="tag lime">Buddy suggests</p><p class="big" style="margin-top:8px">Add: Owned a Kafka migration</p>`, 280, 1.4, 0, 2, "") },
        { name: "Hiring memory", body:
          T(`<p class="tag lime">Hiring memory</p><p class="quote" style="margin-top:16px">Would meet: owned the Kafka migration end to end</p>`, 0, 0, 0, -2) },
        // ——— Find
        { name: "Semantic search", body:
          T(`<div class="row"><span class="mark" style="--o:60px"></span><p class="ty mid" style="--d:0.1s">Scaled payments at a startup</p></div>`, 0, 0, 0.06, -2, "outline") +
          T(`<p class="tag">Buddy understood ${PEN}</p><div class="chips" style="margin-top:14px"><span class="chip on pop" style="--d:1.1s">Role: Backend Engineer</span><span class="chip on pop" style="--d:1.25s">Skill: Kafka</span><span class="chip on pop" style="--d:1.4s">Location: Bangalore</span></div>`, 160, 0.8, 0, 2) },
        { name: "Target companies", body:
          T(`<p style="font-weight:900;font-size:96px;letter-spacing:-0.04em;line-height:1">25</p><p class="big">similar companies</p><div class="chips" style="margin-top:18px"><span class="chip on pop" style="--d:0.4s">Same domain</span><span class="chip on pop" style="--d:0.55s">Similar headcount</span></div>
            <div class="col" style="margin-top:22px;gap:10px">${[0, 1, 2].map((i) => `<div class="row pop" style="--d:${0.75 + i * 0.12}s;gap:14px"><span class="bar" style="flex:1"><i style="--w:${70 - i * 12}%;--d:${0.75 + i * 0.12}s;background:var(--line)"></i></span><span class="tag">source ${EXT}</span></div>`).join("")}</div>`, 0, 0, 0, -2) },
        { name: "Always looking", body:
          T(`<p class="tag lime">Found since yesterday</p><div class="row" style="margin-top:16px"><span style="font-weight:900;font-size:110px;letter-spacing:-0.04em;line-height:1">14</span><span class="big">new people<br>to review</span></div>
            <div class="row" style="margin-top:18px;gap:0">${["AK", "RS", "MN", "PD", "SV", "+9"].map((a, i) => `<span class="avatar pop" style="--d:${0.4 + i * 0.08}s;margin-left:${i ? -14 : 0}px;border:4px solid #fff">${a}</span>`).join("")}</div>`, 0, 0, 0, -2) },
        { name: "Past candidates", body:
          T(`<div class="row"><span class="avatar">MN</span><div class="col" style="gap:6px"><span class="mid">Reached interview for Platform Engineer</span><span class="chip on pop" style="--d:0.4s;justify-self:start">worth another look</span></div></div>`, 0, 0, 0, -2) },
        { name: "Hire for timing", body:
          T(`<div class="row"><span class="ring" style="--to:85;--d:0.1s"><span></span></span><span class="big">Good time to<br>reach out</span></div>`, 0, 0, 0.08, -2) +
          T(`<div class="col">${[["+25", "Same title for 4½ years · CV"], ["+30", `Layoffs at his company · News ↗`], ["+15", "Updated his profile"]].map(([p, t], i) => `<div class="row pop" style="--d:${0.7 + i * 0.25}s"><span class="chip ink" style="min-width:110px;justify-content:center">${p}</span><span style="font-size:29px">${t}</span></div>`).join("")}</div>`, 240, 0.5, 0, 2) },
        // ——— Screen
        { name: "Evidence screening", body:
          T(`<div class="row" style="justify-content:space-between"><span class="big">Matches 4 of 5 essentials</span><span class="dots"><i></i><i></i><i></i><i></i><i class="off"></i></span></div>`, 0, 0, 0.06, -2) +
          T(`<p class="tag lime">CV · quoted</p><p class="quote" style="margin-top:14px">“Led the settlement migration to Kafka”</p>`, 190, 0.6, 0, 2) },
        { name: "Review mode", body:
          T(`<div class="row" style="justify-content:space-between"><div class="row"><span class="avatar">AK</span><span class="mid">Aarav K.</span></div><span class="chip ink">1 of 21</span></div>`, 0, 0, 0.06, -2) +
          `<div style="position:absolute;left:0;right:0;top:200px;display:flex;justify-content:center;gap:16px">${[["Shortlist", "S", "lime"], ["Hold", "H", ""], ["Reject", "R", ""]].map(([w, k, c], i) => `<span class="key ${c} tile" style="position:relative;left:auto;right:auto;padding:16px 24px;--d:${0.4 + i * 0.12}s;--x:${i * 0.03}s;--r:${i - 1}deg">${w} <kbd>${k}</kbd></span>`).join("")}</div>` },
        // ——— Engage
        { name: "Outreach drafts", body:
          T(`<p class="tag lime">Draft · email to Aarav</p><p class="big" style="margin-top:12px">Your payments-ledger work, and a role built around it</p><div class="row" style="margin-top:22px"><span class="key lime pop" style="--d:0.9s">${CHECK} Approve</span><span class="tag">nothing sends until you do</span></div>`, 0, 0, 0, -2) },
        { name: "Interest check", phone: `<div class="from"><span class="mark" style="--o:44px"></span>TALYNT LABS</div>
            <p class="bubble pop" style="--d:0.2s">Would you like to hear more?</p>
            <p class="btn pop" style="--d:0.7s">Yes, I’m interested</p>
            <p class="toast stamp" style="--d:1.3s">${CHECK} Confirmed interest</p>` },
        { name: "Self-scheduling", phone: `<div class="from"><span class="mark" style="--o:44px"></span>Pick a time</div>
            <div class="slots">${["Tue 11:00", "Tue 15:30", "Wed 10:00", "Thu 12:00"].map((s, i) => `<span class="pop ${i === 2 ? "on" : ""}" style="--d:${0.2 + i * 0.1}s">${s}</span>`).join("")}</div>
            <p class="toast stamp" style="--d:1s">${CHECK} You’re booked</p>` },
        // ——— Interview
        { name: "Interview kit", body:
          T(`<div class="row" style="justify-content:space-between"><span class="mid">A payments outage you owned</span><span class="chip on">JD: ON-CALL</span></div>`, 0, 0, 0.06, -2) +
          T(`<div class="row" style="justify-content:space-between"><span class="mid">When events cost more than they saved</span><span class="chip ink">OPEN GAP</span></div>`, 150, 0.35, 0, 2) },
        { name: "Deep-dives", body:
          T(`<p class="big">Why leave a 5,000-person company for a team of 20?</p><div class="row" style="margin-top:20px;gap:10px">${["L1", "L2", "L3"].map((l, i) => `<span class="chip ${i ? "" : "on"} pop" style="--d:${0.5 + i * 0.15}s">${l}</span>${i < 2 ? '<span class="tag pop" style="--d:' + (0.55 + i * 0.15) + 's">→</span>' : ""}`).join("")}</div>`, 0, 0, 0.06, -2) +
          T(`<div class="row" style="justify-content:space-between"><span class="mid">Strong answer benchmark</span><span class="chip amber">Mixed vs benchmark</span></div>`, 270, 1, 0, 2) },
        { name: "Call check", body:
          `<div style="position:absolute;left:0;right:0;top:0;display:grid;grid-template-columns:1fr 1fr;gap:18px">
            <div class="tile" style="position:relative;--d:0s;--x:0.06s;--r:-2deg"><p class="tag">Candidate</p><p class="big" style="margin-top:8px">Matches 4 of 5</p></div>
            <div class="tile" style="position:relative;--d:0.2s;--x:0.03s;--r:2deg"><p class="tag">Interviewer</p><p class="big" style="margin-top:8px">Questions on JD 63%</p></div></div>` +
          T(`<div class="row"><span class="chip red">Never asked</span><span class="mid">On-call ownership</span></div>`, 210, 0.7, 0, 2) },
        { name: "Risky questions", body:
          T(`<p class="mid" style="color:var(--red)">‘Are you planning to start a family?’</p><div class="row" style="margin-top:16px"><span class="chip red stamp" style="--d:0.6s">Avoid: protected topic</span></div>`, 0, 0, 0, -2, "risky") },
        { name: "Manager profiles", body:
          T(`<div class="row"><span class="avatar">PS</span><span class="big">Priya S.</span><span class="tag" style="margin-left:auto">Hiring manager</span></div>
            <div class="row" style="margin-top:22px"><span class="mid" style="width:300px">Questions on JD</span><span class="bar" style="flex:1"><i style="--w:63%"></i></span><span class="mid">63%</span></div>
            <div class="row" style="margin-top:16px"><span class="mid">Often skips:</span><span class="chip amber pop" style="--d:0.7s">API design</span></div>`, 0, 0, 0, -2) },
        // ——— Decide
        { name: "Authenticity", body:
          T(`<div class="row" style="justify-content:space-between"><span class="mid">Near-identical CV</span><span class="chip amber">Check with a person</span></div>`, 0, 0, 0.06, -2) +
          T(`<div class="row" style="justify-content:space-between"><span class="mid">CV says 8 years</span><span class="tag">/</span><span class="mid">on the call: about 5</span></div>`, 150, 0.4, 0, 2) },
        { name: "Manager review", body:
          T(`<div class="row"><span class="avatar">AK</span><div class="col" style="gap:4px"><span class="mid">Aarav K. · Backend engineer</span><span class="tag">Evidence: 4 of 5 essentials · CV quotes</span></div></div>`, 0, 0, 0.06, -2) +
          `<div style="position:absolute;left:0;right:0;top:200px;display:flex;justify-content:center;gap:16px">${[["Interested", "lime"], ["Not a fit", ""], ["Question", ""]].map(([w, c], i) => `<span class="key ${c} tile" style="position:relative;left:auto;right:auto;--d:${0.4 + i * 0.12}s;--x:${i * 0.03}s;--r:${i - 1}deg">${w}</span>`).join("")}</div>` },
        { name: "Inbox", body:
          T(`<div class="row"><span style="position:relative;display:grid;place-items:center;width:96px;height:96px;border-radius:50%;background:var(--ink);color:#fff"><span style="width:52px;height:52px">${BELL}</span><b class="stamp" style="--d:0.3s;position:absolute;top:-6px;right:-6px;display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--lime);color:var(--ink);font-size:24px;border:3px solid var(--ink)">3</b></span><span class="big">Needs you</span></div>
            <div class="col" style="margin-top:20px;gap:12px">${["Approve", "Interviews"].map((t, i) => `<div class="row pop" style="--d:${0.6 + i * 0.2}s;justify-content:space-between;padding:16px 20px;border-radius:16px;background:var(--soft)"><span class="mid">${t}</span><span class="row" style="gap:10px"><span class="chip on">Done</span><span class="chip">Snooze</span></span></div>`).join("")}</div>`, 0, 0, 0, -2) },
      ];

      const scenes = document.getElementById("scenes");
      const add = (html, tin, tout, cls = "") => {
        const s = el("section", `scene ${cls}`, html, `--in:${tin}s;--out:${tout}s`);
        scenes.append(s);
      };
      // Hook.
      add(`<div class="words"><b style="--d:0.08s;--x:0s">Got a</b><b style="--d:0.3s;--x:0.06s">hiring</b><b class="hi" style="--d:0.55s;--x:0.12s">problem?</b></div>`, 0, 2);
      // Features.
      SCENES.forEach((s, i) => {
        const tin = CUTS[i], tout = CUTS[i + 1];
        const vis = s.phone ? `<div class="vis"><div class="phone"><div class="screen">${s.phone}</div></div></div>` : `<div class="vis">${s.body}</div>`;
        add(`<div class="step"><span>${s.name}</span></div>${vis}`, tin, tout);
      });
      // Closing line.
      add(`<div class="words" style="--wfs:116px"><b style="--d:85.7s;--x:0s">Buddy finds.</b><b style="--d:86.2s;--x:0.06s">Buddy checks.</b><b class="hi" style="--d:86.8s;--x:0.12s">People decide.</b></div>`, 85.5, 89);

      // Step names: fit the frame, then letters hop in.
      document.querySelectorAll(".step span").forEach((sp) => {
        sp.innerHTML = [...sp.textContent].map((c, k) => (c === " " ? " " : `<em style="--k:${k}">${c}</em>`)).join("");
        const max = f === "s" ? 1000 : 980;
        const base = f === "s" ? 92 : 124;
        sp.style.setProperty("--fs", `${base}px`);
        const w = sp.offsetWidth;
        if (w > max) sp.style.setProperty("--fs", `${Math.floor((base * max) / w)}px`);
      });
      document.querySelectorAll(".tile.outline").forEach((t) => (t.style.border = "3px solid #0d0d0d"));
      document.querySelectorAll(".tile.risky").forEach((t) => { t.style.background = "#fde8e6"; t.style.borderColor = "#f3b4ae"; });

      // Cuts: a lime or black wipe, and a small shake as the new step lands.
      const ALL = [2, ...CUTS];
      const cuts = document.getElementById("cuts");
      ALL.forEach((c, i) => cuts.append(el("span", `wipe${i % 2 ? " dark" : ""}`, "", `--at:${c - 0.17}s`)));
      document.getElementById("cam").style.animation = ALL.map((c) => `shake 0.24s linear ${(c + 0.12).toFixed(2)}s`).join(", ");

      // Chapters.
      const CH = [["Define", 6, 23.5], ["Find", 23.5, 39], ["Screen", 39, 45.5], ["Engage", 45.5, 55], ["Interview", 55, 75], ["Decide", 75, 85.5]];
      const chapters = document.getElementById("chapters");
      CH.forEach(([n, a, b]) => chapters.append(el("div", "", `<i style="--at:${a}s;--len:${b - a}s"></i><b style="--at:${a}s;--len:${b - a}s">${n}</b>`)));

      const end = document.getElementById("end");
      for (let i = 0; i < 40; i++) {
        const a = (i / 40) * Math.PI * 2, r = 380 + (i % 4) * 90;
        end.append(el("span", `confetti${i % 3 === 0 ? " k" : ""}`, "", `--x:${Math.round(Math.cos(a) * r)}px;--y:${Math.round(Math.sin(a) * r * 0.8)}px;--r:${(i % 2 ? 1 : -1) * (180 + i * 10)}deg`));
      }

      window.__ready = document.fonts.ready.then(() => {
        // Re-fit step names once the fonts have loaded.
        document.querySelectorAll(".step span").forEach((sp) => {
          const max = f === "s" ? 1000 : 980, base = f === "s" ? 92 : 124;
          sp.style.setProperty("--fs", `${base}px`);
          const w = sp.offsetWidth;
          if (w > max) sp.style.setProperty("--fs", `${Math.floor((base * max) / w)}px`);
        });
        return Promise.all([...document.images].map((im) => (im.complete ? 1 : new Promise((r) => (im.onload = r)))));
      });
    </script>
  </body>
</html>

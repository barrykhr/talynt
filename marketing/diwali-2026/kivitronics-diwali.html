html, body { margin: 0; height: 100%; background: var(--bg); }
body { display: flex; align-items: center; justify-content: center; }

<body>
<canvas id="c" width="720" height="720" aria-label="Animated Diwali greeting from Kivitronics"></canvas>
<script>
(() => {
  const W = 720, H = 720;
  const LOOP = 6;                     // seconds; everything is periodic in LOOP
  const TAU = Math.PI * 2;
  const C = {
    navy0: '#040a19', navy1: '#0a1838', navy2: '#13285a',
    gold: '#d4af5a', goldLight: '#f6dc96', amber: '#f2a33a', cream: '#f7eedb',
  };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- deterministic RNG ----------
  function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

  // ---------- static layer (background, frame, rangoli) ----------
  let staticLayer = null;
  function buildStatic() {
    const c = document.createElement('canvas'); c.width = W; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = C.navy0; g.fillRect(0, 0, W, H);
    let rg = g.createRadialGradient(360, 300, 20, 360, 330, 560);
    rg.addColorStop(0, C.navy2); rg.addColorStop(0.45, C.navy1); rg.addColorStop(1, C.navy0);
    g.fillStyle = rg; g.fillRect(0, 0, W, H);
    // warm pool of light under the diyas
    rg = g.createRadialGradient(360, 540, 10, 360, 540, 330);
    rg.addColorStop(0, 'rgba(242,163,58,0.16)'); rg.addColorStop(1, 'rgba(242,163,58,0)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    // faint rangoli mandala behind the title
    g.save(); g.translate(360, 300); g.strokeStyle = 'rgba(212,175,90,0.075)'; g.lineWidth = 1;
    for (const [r, n, d] of [[250, 24, 26], [200, 16, 30], [150, 12, 26]]) {
      g.beginPath(); g.arc(0, 0, r, 0, TAU); g.stroke();
      for (let i = 0; i < n; i++) {
        const a = i / n * TAU;
        g.save(); g.rotate(a);
        g.beginPath(); g.moveTo(r, 0);
        g.quadraticCurveTo(r + d * 0.6, d * 0.55, r + d, 0);
        g.quadraticCurveTo(r + d * 0.6, -d * 0.55, r, 0); g.stroke();
        g.restore();
      }
    }
    for (let i = 0; i < 48; i++) {
      const a = i / 48 * TAU; g.beginPath(); g.arc(Math.cos(a) * 290, Math.sin(a) * 290, 1.4, 0, TAU);
      g.fillStyle = 'rgba(212,175,90,0.12)'; g.fill();
    }
    g.restore();

    // vignette
    rg = g.createRadialGradient(360, 360, 300, 360, 360, 520);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = rg; g.fillRect(0, 0, W, H);

    // double gold frame with corner diamonds
    g.strokeStyle = 'rgba(212,175,90,0.55)'; g.lineWidth = 1;
    g.strokeRect(24.5, 24.5, W - 49, H - 49);
    g.strokeStyle = 'rgba(212,175,90,0.22)';
    g.strokeRect(31.5, 31.5, W - 63, H - 63);
    for (const [x, y] of [[28, 28], [W - 28, 28], [28, H - 28], [W - 28, H - 28]]) diamond(g, x, y, 6, C.gold);
    return c;
  }
  function diamond(g, x, y, r, col) {
    g.beginPath(); g.moveTo(x, y - r); g.lineTo(x + r, y); g.lineTo(x, y + r); g.lineTo(x - r, y); g.closePath();
    g.fillStyle = col; g.fill();
  }

  // ---------- floating sparkles (periodic drift + twinkle) ----------
  const sparkles = (() => {
    const r = rng(7), out = [];
    for (let i = 0; i < 46; i++) {
      out.push({ x: 50 + r() * 620, y: 50 + r() * 620, amp: 4 + r() * 10, ph: r() * TAU,
                 tw: 1 + Math.floor(r() * 3), size: 0.6 + r() * 1.4,
                 col: r() < 0.8 ? '255,226,160' : '255,255,255' });
    }
    return out;
  })();

  // ---------- fireworks ----------
  const ACCENTS = { gold: '246,214,140', amber: '242,163,58', cream: '255,246,224', rose: '255,120,150', teal: '110,230,214' };
  const bursts = [
    { t0: 0.15, x: 100, y: 98, v: 118, n: 56, cols: ['gold', 'gold', 'amber', 'cream'], seed: 11 },
    { t0: 1.65, x: 622, y: 104, v: 125, n: 64, cols: ['amber', 'gold', 'rose', 'gold'],  seed: 23 },
    { t0: 3.15, x: 620, y: 418, v: 112, n: 44, cols: ['gold', 'cream', 'teal', 'gold'],  seed: 37 },
    { t0: 4.55, x: 100, y: 410, v: 112, n: 46, cols: ['amber', 'gold', 'cream', 'rose'], seed: 51 },
  ].map(b => {
    const r = rng(b.seed); b.p = [];
    for (let i = 0; i < b.n; i++) {
      const a = i / b.n * TAU + (r() - 0.5) * 0.12;
      b.p.push({ a, s: b.v * (0.72 + r() * 0.28), c: ACCENTS[b.cols[Math.floor(r() * b.cols.length)]], tw: r() * TAU });
    }
    return b;
  });
  const LIFE = 2.2, K = 2.4, GRAV = 26;
  function fpos(p, b, a) {
    const d = p.s * (1 - Math.exp(-K * a)) / K;
    return [b.x + Math.cos(p.a) * d, b.y + Math.sin(p.a) * d + 0.5 * GRAV * a * a];
  }
  function drawFireworks(t) {
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.lineCap = 'round';
    for (const b of bursts) {
      const age = ((t - b.t0) % LOOP + LOOP) % LOOP;
      if (age > LIFE) continue;
      // brief bloom at the core
      if (age < 0.35) {
        const k = 1 - age / 0.35;
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 46);
        g.addColorStop(0, `rgba(255,240,200,${0.55 * k})`); g.addColorStop(1, 'rgba(255,200,120,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(b.x, b.y, 46, 0, TAU); ctx.fill();
      }
      const fade = Math.pow(1 - age / LIFE, 1.6);
      for (const p of b.p) {
        const [x, y] = fpos(p, b, age);
        const [x0, y0] = fpos(p, b, Math.max(0, age - 0.16));
        const tw = age > 1.0 ? 0.55 + 0.45 * Math.sin(age * 22 + p.tw) : 1;
        const al = fade * tw;
        ctx.strokeStyle = `rgba(${p.c},${0.35 * al})`; ctx.lineWidth = 1.2;
        ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x, y); ctx.stroke();
        ctx.fillStyle = `rgba(${p.c},${0.9 * al})`;
        ctx.beginPath(); ctx.arc(x, y, 1.7, 0, TAU); ctx.fill();
      }
    }
    ctx.restore();
  }

  // ---------- diyas ----------
  const diyas = [
    { x: 184, s: 0.84, ph: 0.3 }, { x: 271, s: 0.96, ph: 1.7 }, { x: 360, s: 1.14, ph: 3.1 },
    { x: 449, s: 0.96, ph: 4.4 }, { x: 536, s: 0.84, ph: 5.6 },
  ];
  const DIYA_Y = 530;
  // flicker made only of whole-number cycles per loop, so the GIF loops seamlessly
  function flick(t, ph) {
    const u = t / LOOP * TAU;
    return 0.5 * Math.sin(u * 9 + ph) + 0.3 * Math.sin(u * 14 + ph * 2.3) + 0.2 * Math.sin(u * 23 + ph * 1.7);
  }
  function drawDiyaGlow(d, t) {
    const f = flick(t, d.ph);
    const fx = d.x, fy = DIYA_Y - 26 * d.s;
    const R = 120 * d.s * (1 + 0.05 * f);
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, R);
    g.addColorStop(0, `rgba(255,190,90,${0.42 + 0.06 * f})`);
    g.addColorStop(0.35, 'rgba(242,150,50,0.14)');
    g.addColorStop(1, 'rgba(242,140,40,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(fx, fy, R, 0, TAU); ctx.fill();
  }
  function drawDiya(d, t) {
    const { x, s } = d, y = DIYA_Y;
    const f = flick(t, d.ph);
    ctx.save();
    // foot
    ctx.fillStyle = '#5a2210';
    ctx.beginPath(); ctx.ellipse(x, y + 24 * s, 13 * s, 4 * s, 0, 0, TAU); ctx.fill();
    // bowl body
    const bw = 40 * s;
    let g = ctx.createLinearGradient(x - bw, 0, x + bw, 0);
    g.addColorStop(0, '#6e2711'); g.addColorStop(0.35, '#b85a2a'); g.addColorStop(0.55, '#c86d34'); g.addColorStop(1, '#5c1f0c');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x - bw, y);
    ctx.bezierCurveTo(x - bw * 0.9, y + 30 * s, x + bw * 0.9, y + 30 * s, x + bw, y);
    ctx.closePath(); ctx.fill();
    // warm light falling on the front of the bowl
    g = ctx.createRadialGradient(x, y - 4 * s, 2, x, y + 4 * s, bw);
    g.addColorStop(0, `rgba(255,190,110,${0.35 + 0.05 * f})`); g.addColorStop(1, 'rgba(255,190,110,0)');
    ctx.fillStyle = g; ctx.fill();
    // gold band of dots
    ctx.fillStyle = C.goldLight;
    for (let i = 1; i < 10; i++) {
      const u = i / 10, bx = x - bw * 0.82 + u * bw * 1.64;
      const by = y + 9 * s + Math.sin(u * Math.PI) * 7 * s;
      ctx.globalAlpha = 0.85; ctx.beginPath(); ctx.arc(bx, by, 1.4 * s, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
    // rim + oil
    ctx.beginPath(); ctx.ellipse(x, y, bw, 7 * s, 0, 0, TAU);
    ctx.fillStyle = '#2b1206'; ctx.fill();
    ctx.lineWidth = 2 * s; ctx.strokeStyle = C.gold; ctx.stroke();
    g = ctx.createRadialGradient(x, y, 0, x, y, bw);
    g.addColorStop(0, `rgba(255,170,70,${0.55 + 0.08 * f})`); g.addColorStop(1, 'rgba(255,170,70,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(x, y, bw * 0.9, 5.5 * s, 0, 0, TAU); ctx.fill();
    // wick
    ctx.strokeStyle = '#3a1a0a'; ctx.lineWidth = 2 * s;
    ctx.beginPath(); ctx.moveTo(x, y - 1 * s); ctx.lineTo(x + 1 * s, y - 6 * s); ctx.stroke();

    // flame
    const fh = 36 * s * (1 + 0.07 * f), fw = 9 * s * (1 - 0.03 * f);
    const sway = 2.2 * s * Math.sin(t / LOOP * TAU * 5 + d.ph);
    const bx = x + 1 * s, by = y - 4 * s, tx = bx + sway, ty = by - fh;
    ctx.globalCompositeOperation = 'lighter';
    const flamePath = (k) => {
      ctx.beginPath(); ctx.moveTo(tx, by - fh * k);
      ctx.bezierCurveTo(bx + fw * 0.9 * k, by - fh * 0.55 * k, bx + fw * k * 1.15, by - 2 * s, bx, by);
      ctx.bezierCurveTo(bx - fw * k * 1.15, by - 2 * s, bx - fw * 0.9 * k, by - fh * 0.55 * k, tx, by - fh * k);
    };
    g = ctx.createRadialGradient(bx, by - fh * 0.25, 1, bx, by - fh * 0.35, fh * 0.8);
    g.addColorStop(0, 'rgba(255,214,120,0.95)'); g.addColorStop(0.6, 'rgba(242,140,40,0.75)'); g.addColorStop(1, 'rgba(220,90,20,0)');
    ctx.fillStyle = g; flamePath(1); ctx.fill();
    g = ctx.createRadialGradient(bx, by - fh * 0.22, 0, bx, by - fh * 0.3, fh * 0.45);
    g.addColorStop(0, 'rgba(255,255,245,1)'); g.addColorStop(0.5, 'rgba(255,240,190,0.9)'); g.addColorStop(1, 'rgba(255,220,140,0)');
    ctx.fillStyle = g; flamePath(0.62); ctx.fill();
    ctx.restore();
  }

  // ---------- typography ----------
  function textCenter(str, y, font, fill, spacing = 0) {
    ctx.font = font; ctx.letterSpacing = spacing + 'px';
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    // letterSpacing adds trailing space after the last glyph; shift to stay optically centred
    ctx.fillStyle = fill; ctx.fillText(str, 360 + spacing / 2, y);
    ctx.letterSpacing = '0px';
  }
  function divider(y, half) {
    ctx.save();
    let g = ctx.createLinearGradient(360 - half, 0, 360, 0);
    g.addColorStop(0, 'rgba(212,175,90,0)'); g.addColorStop(1, 'rgba(212,175,90,0.85)');
    ctx.fillStyle = g; ctx.fillRect(360 - half, y - 0.5, half - 12, 1);
    g = ctx.createLinearGradient(360 + half, 0, 360, 0);
    g.addColorStop(0, 'rgba(212,175,90,0)'); g.addColorStop(1, 'rgba(212,175,90,0.85)');
    ctx.fillStyle = g; ctx.fillRect(372, y - 0.5, half - 12, 1);
    diamond(ctx, 360, y, 4.5, C.goldLight);
    ctx.restore();
  }
  function drawTitle(t) {
    ctx.save();
    ctx.font = 'italic 600 82px "Cormorant Garamond"';
    ctx.textAlign = 'center';
    const w = ctx.measureText('Happy Diwali').width;
    // slow sheen that sweeps across once per loop
    const p = (t / LOOP) * 1.8 - 0.4;
    const g = ctx.createLinearGradient(360 - w / 2, 0, 360 + w / 2, 0);
    const stops = [[0, '#c9973f'], [0.5, '#f0cf7e'], [1, '#c9973f']];
    for (const [o, c] of stops) g.addColorStop(o, c);
    for (const [o, a] of [[p - 0.12, 0], [p, 1], [p + 0.12, 0]]) {
      if (o > 0 && o < 1) g.addColorStop(o, a ? '#fff4d2' : (o < 0.5 ? '#dcb05a' : '#e2b965'));
    }
    ctx.shadowColor = 'rgba(242,170,70,0.45)'; ctx.shadowBlur = 22;
    ctx.fillStyle = g; ctx.fillText('Happy Diwali', 360, 192);
    ctx.restore();
  }

  const QUOTE = [
    '“May our shared ideas spark brighter',
    'possibilities, and our collaboration',
    'bring lasting growth and prosperity.”',
  ];

  // ---------- frame ----------
  function renderFrame(t) {
    t = ((t % LOOP) + LOOP) % LOOP;
    if (!staticLayer) staticLayer = buildStatic();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(staticLayer, 0, 0);

    drawFireworks(t);

    // sparkles
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const s of sparkles) {
      const u = t / LOOP * TAU;
      const a = 0.25 + 0.55 * Math.max(0, Math.sin(u * s.tw + s.ph));
      ctx.fillStyle = `rgba(${s.col},${a * 0.7})`;
      ctx.beginPath(); ctx.arc(s.x + Math.sin(u + s.ph) * 3, s.y + Math.cos(u + s.ph) * s.amp, s.size, 0, TAU); ctx.fill();
    }
    ctx.restore();

    // glows first (additive), then lamps
    ctx.save(); ctx.globalCompositeOperation = 'lighter';
    for (const d of diyas) drawDiyaGlow(d, t);
    ctx.restore();
    for (const d of diyas) drawDiya(d, t);

    // text
    textCenter('SEASON’S GREETINGS', 104, '500 13px Montserrat', 'rgba(232,199,122,0.9)', 7);
    drawTitle(t);
    divider(228, 120);
    ctx.save(); ctx.shadowColor = 'rgba(4,10,25,0.9)'; ctx.shadowBlur = 10;
    QUOTE.forEach((line, i) => textCenter(line, 290 + i * 44, '500 30px "Cormorant Garamond"', C.cream));
    ctx.restore();

    textCenter('WITH WARM WISHES FROM', 616, '500 10.5px Montserrat', 'rgba(212,175,90,0.75)', 5);
    ctx.save(); ctx.shadowColor = 'rgba(242,170,70,0.35)'; ctx.shadowBlur = 12;
    textCenter('Kivitronics', 656, '600 27px Montserrat', C.goldLight, 3);
    ctx.restore();
  }

  window.LOOP = LOOP;
  window.renderFrame = renderFrame;

  const capture = new URLSearchParams(location.search).has('capture');
  document.fonts.ready.then(() => {
    Promise.all([
      document.fonts.load('italic 600 82px "Cormorant Garamond"'),
      document.fonts.load('500 30px "Cormorant Garamond"'),
      document.fonts.load('500 13px Montserrat'), document.fonts.load('600 27px Montserrat'),
    ]).then(() => {
      window.fontsReady = true;
      renderFrame(0);
      if (!capture) {
        const start = performance.now();
        const tick = (now) => { renderFrame((now - start) / 1000); requestAnimationFrame(tick); };
        requestAnimationFrame(tick);
      }
    });
  });
})();
</script>
</body>
</html>
